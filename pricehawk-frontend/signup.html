<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - PriceHawk</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    }

    :root {
      --bg1: #0f0f0f;
      --bg2: #1a1a2e;
      --card1: rgba(30, 30, 46, 0.95);
      --card2: rgba(37, 37, 54, 0.95);
      --text: #f8f9fa;
      --muted: #b0b0b0;
      --primary: #f5a425;
      --primary2: #ffcd3c;
      --border: rgba(245, 164, 37, 0.28);
      --shadow: 0 28px 70px rgba(0, 0, 0, 0.45);
      --success: #22c55e;
      --error: #ef4444;
    }

    body {
      background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
    }

    button, input {
      font: inherit;
    }

    .container {
      width: min(1400px, calc(100% - 32px));
      margin: 0 auto;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(17, 17, 17, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(245, 164, 37, 0.2);
      z-index: 1000;
    }

    .nav-container {
      min-height: 76px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    .nav-menu {
      display: flex;
      list-style: none;
      gap: 28px;
      align-items: center;
    }

    .nav-link {
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
      position: relative;
      padding: 8px 0;
      transition: color 0.3s ease;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 2px;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--primary);
    }

    .nav-link:hover::after,
    .nav-link.active::after {
      width: 100%;
    }

    .hamburger {
      display: none;
      width: 48px;
      height: 48px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      cursor: pointer;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .hamburger-inner {
      width: 22px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hamburger-inner span {
      display: block;
      height: 2px;
      width: 100%;
      background: var(--primary);
      transition: all 0.3s ease;
    }

    .page-wrap {
      min-height: 100vh;
      padding-top: 110px;
      padding-bottom: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .signup-container {
      background: linear-gradient(135deg, var(--card1) 0%, var(--card2) 100%);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: clamp(24px, 4vw, 52px);
      box-shadow: var(--shadow);
      max-width: 520px;
      width: 100%;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .signup-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--primary2), var(--primary));
      background-size: 200% 100%;
      animation: gradientShift 3s linear infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    .signup-title {
      font-size: clamp(28px, 5vw, 38px);
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .signup-subtitle {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 28px;
    }

    #formStatus {
      display: none;
      margin-bottom: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }

    .status-success {
      display: block;
      color: var(--success);
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.35);
    }

    .status-error {
      display: block;
      color: var(--error);
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .status-loading {
      display: block;
      color: var(--primary);
      background: rgba(245, 164, 37, 0.12);
      border: 1px solid rgba(245, 164, 37, 0.35);
    }

    .form-group {
      position: relative;
      margin-bottom: 18px;
      text-align: left;
    }

    .input-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--primary);
      font-size: 16px;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      min-height: 54px;
      padding: 14px 16px 14px 48px;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      color: #fff;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .form-input::placeholder {
      color: rgba(248, 249, 250, 0.55);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(245, 164, 37, 0.12);
      background: rgba(255, 255, 255, 0.12);
    }

    .password-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin: 10px 0 22px;
      text-align: left;
      color: var(--muted);
      font-size: 14px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--primary);
      flex-shrink: 0;
    }

    .signup-btn {
      width: 100%;
      min-height: 54px;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: #000;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 20px;
    }

    .signup-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 16px 28px rgba(245, 164, 37, 0.32);
    }

    .signup-btn:disabled {
      opacity: 0.75;
      cursor: not-allowed;
    }

    .divider {
      position: relative;
      margin: 24px 0;
      color: #767676;
      font-size: 14px;
    }

    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.14);
    }

    .divider span {
      position: relative;
      background: rgba(30, 30, 46, 0.95);
      padding: 0 14px;
    }

    .social-login {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 24px;
    }

    .social-btn {
      min-height: 50px;
      padding: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .social-btn:hover {
      border-color: var(--primary);
      background: rgba(245, 164, 37, 0.10);
      transform: translateY(-2px);
    }

    .bottom-text {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .login-link {
      color: var(--primary);
      font-weight: 600;
    }

    .login-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .container {
        width: min(100% - 20px, 1400px);
      }

      .hamburger {
        display: flex;
      }

      .nav-menu {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: rgba(17, 17, 17, 0.98);
        border-top: 1px solid rgba(245, 164, 37, 0.15);
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
        padding: 12px 20px 18px;
        display: none;
      }

      .nav-menu.active {
        display: flex;
      }

      .nav-menu li {
        width: 100%;
      }

      .nav-link {
        display: block;
        width: 100%;
        padding: 14px 0;
        font-size: 16px;
      }

      .nav-link::after {
        display: none;
      }

      .page-wrap {
        padding-top: 100px;
        align-items: flex-start;
      }

      .signup-container {
        border-radius: 20px;
      }

      .social-login {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .signup-container {
        padding: 22px 16px;
      }

      .signup-title {
        font-size: 30px;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">🦅 PriceHawk</a>

      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="stores.html" class="nav-link">Stores</a></li>
        <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
      </ul>

      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <div class="hamburger-inner">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </button>
    </div>
  </nav>

  <main class="page-wrap">
    <div class="signup-container">
      <h1 class="signup-title">Join PriceHawk</h1>
      <p class="signup-subtitle">Create your account to track prices and get deal alerts instantly.</p>

      <div id="formStatus"></div>

      <form id="signupForm">
        <div class="form-group">
          <i class="fas fa-user input-icon"></i>
          <input type="text" id="name" class="form-input" name="name" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <i class="fas fa-envelope input-icon"></i>
          <input type="email" id="email" class="form-input" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <i class="fas fa-phone input-icon"></i>
          <input type="tel" id="phone" class="form-input" name="phone" placeholder="Phone (optional)">
        </div>

        <div class="form-group">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="password" class="form-input" name="password" placeholder="Password" required>
          <button type="button" class="password-toggle" data-toggle="password">
            <i class="fas fa-eye"></i>
          </button>
        </div>

        <div class="form-group">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="confirmPassword" class="form-input" name="confirmPassword" placeholder="Confirm password" required>
          <button type="button" class="password-toggle" data-toggle="confirmPassword">
            <i class="fas fa-eye"></i>
          </button>
        </div>

        <label class="checkbox-group">
          <input type="checkbox" id="terms" required>
          <span>I agree to the Terms of Service and Privacy Policy.</span>
        </label>

        <button type="submit" class="signup-btn" id="signupBtn">Create Account</button>

        <div class="divider">
          <span>or sign up with</span>
        </div>

        <div class="social-login">
          <a href="#" class="social-btn">
            <i class="fab fa-google"></i>
            <span>Google</span>
          </a>
          <a href="#" class="social-btn">
            <i class="fab fa-facebook-f"></i>
            <span>Facebook</span>
          </a>
        </div>

        <p class="bottom-text">
          Already have an account?
          <a href="login.html" class="login-link">Sign in here</a>
        </p>
      </form>
    </div>
  </main>

  <script>
    const hamburger = document.getElementById('hamburger');
    const navMenu = document.getElementById('navMenu');
    const signupForm = document.getElementById('signupForm');
    const signupBtn = document.getElementById('signupBtn');
    const formStatus = document.getElementById('formStatus');

    hamburger.addEventListener('click', () => {
      navMenu.classList.toggle('active');
    });

    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        navMenu.classList.remove('active');
      });
    });

    document.querySelectorAll('.password-toggle').forEach(button => {
      button.addEventListener('click', () => {
        const inputId = button.getAttribute('data-toggle');
        const input = document.getElementById(inputId);
        const icon = button.querySelector('i');

        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.remove('fa-eye');
          icon.classList.add('fa-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.remove('fa-eye-slash');
          icon.classList.add('fa-eye');
        }
      });
    });

    signupForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const terms = document.getElementById('terms').checked;

      if (password !== confirmPassword) {
        formStatus.className = 'status-error';
        formStatus.textContent = 'Passwords do not match.';
        return;
      }

      if (!terms) {
        formStatus.className = 'status-error';
        formStatus.textContent = 'Please accept the terms and privacy policy.';
        return;
      }

      signupBtn.disabled = true;
      signupBtn.textContent = 'Creating Account...';
      formStatus.className = 'status-loading';
      formStatus.textContent = 'Creating your account...';

      setTimeout(() => {
        formStatus.className = 'status-success';
        formStatus.textContent = '✅ Account created successfully!';
        signupBtn.textContent = 'Success!';
      }, 1500);
    });
  </script>
</body>
</html>
